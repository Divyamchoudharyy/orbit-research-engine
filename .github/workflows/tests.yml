name: Tests and Docker Build

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: test-groq-key
      TAVILY_API_KEY: test-tavily-key
      LANGSMITH_TRACING_V2: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment YAML
        run: |
          python -m pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('render.yaml', encoding='utf-8')); yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))"
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build application image
        run: docker build --tag orbit-research-engine:ci .
