databases:
  - name: orbit-postgres
    databaseName: orbit
    user: orbit
    plan: basic-256mb

services:
  - type: web
    name: orbit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m uvicorn src.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: starter
    healthCheckPath: /ready
    envVars:
      - key: ORBIT_ENV
        value: production
      - key: ORBIT_API_KEY
        sync: false
      - key: ORBIT_UI_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-postgres
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: orbit-research-engine
      - key: LANGSMITH_TRACING_V2
        value: "false"
      - key: CORS_ORIGINS
        value: https://orbit-ui.onrender.com

  - type: web
    name: orbit-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m streamlit run src/ui/streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    plan: starter
    healthCheckPath: /_stcore/health
    envVars:
      - key: API_BASE
        fromService:
          type: web
          name: orbit-api
          property: host
      - key: ORBIT_API_KEY
        sync: false
      - key: ORBIT_UI_PASSWORD
        sync: false
      - key: ORBIT_ENV
        value: production
