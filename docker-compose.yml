services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
      POSTGRES_DB: orbit
    volumes:
      - orbit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: >
      python -m uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      ORBIT_ENV: ${ORBIT_ENV:-development}
      ORBIT_API_KEY: ${ORBIT_API_KEY:-local-development-only-change-me}
      DATABASE_URL: postgresql://orbit:${POSTGRES_PASSWORD:-localdevpassword}@db:5432/orbit
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
      LANGSMITH_TRACING_V2: ${LANGSMITH_TRACING_V2:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ui:
    build: .
    restart: unless-stopped
    command: >
      python -m streamlit run src/ui/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      API_BASE: http://api:8000
      ORBIT_API_KEY: ${ORBIT_API_KEY:-local-development-only-change-me}
    depends_on:
      api:
        condition: service_healthy

volumes:
  orbit_postgres_data:
